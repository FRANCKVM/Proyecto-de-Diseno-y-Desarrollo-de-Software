spring.application.name=tasfb2b

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tasfb2b?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pdds}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pdds}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connection-timeout=60000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
