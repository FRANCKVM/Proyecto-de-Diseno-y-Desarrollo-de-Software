services:
  mysql:
    image: mysql:8.4
    container_name: tasfb2b_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pdds
      MYSQL_DATABASE: tasfb2b
      MYSQL_USER: pdds
      MYSQL_PASSWORD: pdds
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-updds", "-ppdds"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      tasfb2b_network:
        ipv4_address: 172.28.1.2

  backend:
    build:
      context: ./backend
    container_name: tasfb2b_backend
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c", "until (echo >/dev/tcp/mysql/3306) 2>/dev/null; do echo 'Waiting for MySQL...'; sleep 2; done && java -jar app.jar"]
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "mysql:172.28.1.2"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tasfb2b?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: pdds
      SPRING_DATASOURCE_PASSWORD: pdds
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_FORMAT_SQL: "false"
      SPRING_SQL_INIT_MODE: never
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      tasfb2b_network:
        ipv4_address: 172.28.1.3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: tasfb2b_frontend
    restart: unless-stopped
    depends_on:
      - backend
    extra_hosts:
      - "backend:172.28.1.3"
    ports:
      - "5173:80"
    networks:
      tasfb2b_network:
        ipv4_address: 172.28.1.4

volumes:
  mysql_data:

networks:
  tasfb2b_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
